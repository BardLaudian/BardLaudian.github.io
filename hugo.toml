# --- CONFIGURACIÓN BÁSICA ---
baseURL = "https://BardLaudian.github.io/"
languageCode = "es-es"
title = "Pablo Seoane · Pentester & Security Researcher"
theme = "blowfish"

# --- PARÁMETROS DEL TEMA (EL "LOOK") ---
[params]
    colorScheme = "ocean"         # Fondo negro profundo – máxima legibilidad
    defaultAppearance = "dark"   # Modo oscuro por defecto
    showSunMoon = true           # Botón para cambiar entre modo claro/oscuro
    showScrollToTop = true       # Flecha para volver arriba
    enableSearch = true          # Buscador interno (muy útil para tus notas)
    showReadingTime = true       # Mostrar tiempo de lectura
    showBreadcrumbs = true       # Mostrar migas de pan
    showTaxonomies = true        # Mostrar tags y categorías
    smartTOC = true              # Resaltar en el índice la sección que se está leyendo
    description = "Blog personal de Pablo Seoane donde subo todo lo que hago en ciberseguridad a modo de portfolio: writeups de máquinas, análisis de muestras capturadas en mi honeypot y cualquier cosa que considere interesante documentar."

[params.article]
    showTableOfContents = true            # Índice lateral con los headings del propio writeup
    smartTOCHideUnfocusedChildren = true  # Colapsar subsecciones que no se están leyendo
    showAuthor = true                     # Mostrar autor con redes sociales al pie de cada post
    
# --- CONFIGURACIÓN DE LA PORTADA (HOMEPAGE) ---
[params.homepage]
    layout = "profile"        # Estilo perfil profesional
    showRecent = true         # Mostrar posts recientes debajo
    showRecentItems = 3       # Solo los 3 últimos para que no sature
    showContact = true        # Iconos de contacto visibles
    cardView = true           # Los posts se verán como tarjetas modernas

# Vistas de listado de artículos
[params.list]
    groupByYear = true
    cardView = true           # Tarjetas en vez de lista plana

[params.hero]
    # Esto es lo que sale en grande al entrar
    title = "Pablo Seoane Temprano"
    subtitle = "Junior Pentester · CJCA · Preparando Security+ y CPTS"
    content = "Estudiante de Ingeniería Robótica con nivel junior en ciberseguridad. Certificado CJCA, preparando el Security+ y el CPTS. Este es mi blog: subo todo lo que hago en ciberseguridad a modo de portfolio."
    image = "img/perfil.jpg"  # Asegúrate de tener tu foto en assets/img/perfil.jpg

# --- TU IDENTIDAD (AUTOR) ---
[author]
    name = "BardLaudian"        # Pon aquí tu nombre real o alias
    image = "img/perfil.jpg"     # Tu foto en assets/img/perfil.jpg
    headline = "Junior Pentester · CJCA · En camino al Security+ y CPTS"
    bio = "Apasionado del Hacking Ético basado en A Coruña. Certificado CJCA, preparando el CompTIA Security+ y el CPTS de Hack The Box. Documentando el proceso máquina a máquina."
    
    # Redes sociales (Blowfish usa iconos automáticos)
    links = [
        { linkedin = "https://linkedin.com/in/pablo-seoane-temprano" },
        { github = "https://github.com/BardLaudian" },
        { hackthebox = "https://app.hackthebox.com/users/204160" },
        { email = "seoane.pablo16@gmail.com" },
    ]

# --- MENÚ DE NAVEGACIÓN ---
[[menu.main]]
    name = "Writeups"
    url = "/posts/"
    weight = 10

[[menu.main]]
    name = "Honeypot"
    url = "/honeypot/"
    weight = 20



# --- CONFIGURACIÓN DE CONTENIDO ---
[markup.goldmark.renderer]
    unsafe = true                # Permite usar HTML en tu Markdown (necesario para algunas funciones)

[taxonomies]
    category = "categories"
    tag = "tags"
    series = "series"

[outputs]
    home = ["HTML", "RSS", "JSON"] # Necesario para el buscador